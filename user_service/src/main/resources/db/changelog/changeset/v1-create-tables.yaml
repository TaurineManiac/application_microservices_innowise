databaseChangeLog:
  - changeSet:
      id: 1
      author: Ignat
      changes:

        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: surname, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: date_of_birth, type: DATE, constraints: { nullable: false } }
              - column: { name: email, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, constraints: { nullable: false } }


        - createTable:
            tableName: payment_cards
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: number, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: holder, type: VARCHAR(255) }
              - column: { name: expiration_date, type: DATE }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_date, type: timestamp, constraints: { nullable: false } }
              - column: { name: updated_date, type: timestamp, constraints: { nullable: false } }