databaseChangeLog:
  - changeSet:
      id: 3
      author: Ignat
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: order_public_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: orders
            columnNames: order_public_id
            constraintName: uk_orders_order_public_id

        - createIndex:
            tableName: orders
            indexName: idx_orders_order_public_id
            columns:
              - column: { name: order_public_id }