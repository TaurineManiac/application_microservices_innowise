name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-user:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./user_service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile

      - name: Run tests
        run: mvn test

  sonar-analysis-user:
    runs-on: ubuntu-latest
    needs: build-and-test-user
    defaults:
      run:
        working-directory: ./user_service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          JAVA_TOOL_OPTIONS: -Djdk.tls.client.protocols=TLSv1.2
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
              -Dsonar.projectKey=taurinemaniac \
              -Dsonar.organization=taurinemaniac \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.token=$SONAR_TOKEN \
              -Dsonar.java.api.version=21
          else
            echo "Skipping SonarQube analysis (no token provided)"
          fi

  docker-build-user:
    runs-on: ubuntu-latest
    needs: build-and-test-user
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
        continue-on-error: true

      - name: Build Docker image
        run: |
          docker build -t user-service:latest ./user_service

      - name: Tag Docker image
        run: |
          docker tag user-service:latest ${{ secrets.DOCKER_USERNAME }}/user-service:latest
        continue-on-error: true

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest
        continue-on-error: true

  build-and-test-order:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./order_service
    steps:
