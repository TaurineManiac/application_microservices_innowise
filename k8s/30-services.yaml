apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: bank
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: api-gateway-config }
          env:
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: bank-secrets, key: INTERNAL_SERVICE_TOKEN } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: bank
spec:
  selector: { app: api-gateway }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: bank
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: auth-service-config }
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: bank-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: bank-secrets, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: bank-secrets, key: JWT_SECRET } }
            - name: JWT_ACCESS_EXPIRATION
              valueFrom: { secretKeyRef: { name: bank-secrets, key: JWT_ACCESS_EXPIRATION } }
            - name: JWT_REFRESH_EXPIRATION
              valueFrom: { secretKeyRef: { name: bank-secrets, key: JWT_REFRESH_EXPIRATION } }
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: bank-secrets, key: INTERNAL_SERVICE_TOKEN } }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: bank-secrets, key: ADMIN_EMAIL } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: bank-secrets, key: ADMIN_PASSWORD } }
            - name: ADMIN_NAME
              valueFrom: { secretKeyRef: { name: bank-secrets, key: ADMIN_NAME } }
            - name: ADMIN_SURNAME
              valueFrom: { secretKeyRef: { name: bank-secrets, key: ADMIN_SURNAME } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: bank
spec:
  selector: { app: auth-service }
  ports:
    - port: 8080
      targetPort: 8080
---
