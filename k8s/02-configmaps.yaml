apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: bank
data:
  SPRING_PROFILES_ACTIVE: "docker"
  AUTH_SERVICE_URL: "http://auth-service:8080"
  USER_SERVICE_URL: "http://user-service:8080"
  ORDER_SERVICE_URL: "http://order-service:8080"
  PAYMENT_SERVICE_URL: "http://payment-service:8080"
  AUTH_SERVICE_PREDICATE_LOGIN: "/api/auth/login"
  AUTH_SERVICE_PREDICATE_REFRESH: "/api/auth/refresh"
  AUTH_SERVICE_PREDICATE_REGISTER: "/api/auth/register"
  USER_SERVICE_PREDICATE: "/api/v1/users/**"
  ORDER_SERVICE_PREDICATE_ORDERS: "/api/v1/orders/**"
  ORDER_SERVICE_PREDICATE_ITEMS: "/api/v1/items/**"
  PAYMENT_SERVICE_PREDICATE: "/api/v1/payments/**"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: bank
data:
  SPRING_PROFILES_ACTIVE: "docker"
  DB_HOST: "auth-db"
  DB_PORT: "5432"
  DB_NAME: "auth_db"
  USER_SERVICE_URL: "http://user-service:8080"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-svc:9092"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: bank
data:
  SPRING_PROFILES_ACTIVE: "docker"
  DB_HOST: "user-db"
  DB_PORT: "5432"
  DB_NAME: "user_db"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  AUTH_SERVICE_URL: "http://auth-service:8080"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-svc:9092"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: bank
data:
  SPRING_PROFILES_ACTIVE: "docker"
  ORDER_DB_HOST: "order-db"
  ORDER_DB_PORT: "5432"
  ORDER_DB_NAME: "order_db"
  USER_SERVICE_URL: "http://user-service:8080"
  AUTH_SERVICE_URL: "http://auth-service:8080"
  PAYMENT_SERVICE_URL: "http://payment-service:8080"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-svc:9092"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: bank
data:
  SPRING_PROFILES_ACTIVE: "docker"
  DB_HOST: "payment-db"
  DB_PORT: "5432"
  DB_NAME: "payment_db"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-svc:9092"