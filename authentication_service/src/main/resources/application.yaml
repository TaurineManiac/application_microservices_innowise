spring:
  application:
    name: authentication_service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml


jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8080}

admin:
  email: ${ADMIN_EMAIL:admin@system.com}
  password: ${ADMIN_PASSWORD:admin123}
  name: ${ADMIN_NAME:Admin}
  surname: ${ADMIN_SURNAME:Admin}
  retry:
    maxAttempts: 10
    delay: 5000
