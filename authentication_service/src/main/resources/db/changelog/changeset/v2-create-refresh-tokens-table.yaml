databaseChangeLog:
  - changeSet:
      id: 2
      author: Ignat
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: token, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: credential_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: expiry_date, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: revoked, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: refresh_tokens
            columnNames: token
            constraintName: uk_refresh_tokens_token
        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: credential_id
            referencedTableName: credentials
            referencedColumnNames: id
            constraintName: fk_refresh_tokens_credential_id
        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_token
            columns:
              - column: { name: token }