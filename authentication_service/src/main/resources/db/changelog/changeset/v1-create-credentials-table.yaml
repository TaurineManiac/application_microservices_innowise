databaseChangeLog:
  - changeSet:
      id: 1
      author: Ignat
      changes:
        - createTable:
            tableName: credentials
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: public_id, type: UUID, constraints: { nullable: false } }
              - column: { name: email, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: password_hash, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: role, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: credentials
            columnNames: email
            constraintName: uk_credentials_email
        - addUniqueConstraint:
            tableName: credentials
            columnNames: public_id
            constraintName: uk_credentials_public_id